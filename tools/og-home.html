<!-- Plantilla de la imagen para compartir de la portada (1200x630). Se renderiza con Playwright y se guarda como img/og-es.jpg y img/og-en.jpg:
     reemplaza los marcadores H1 y SUB (entre llaves dobles, abajo) y toma una captura de 1200x630. Las rutas son relativas a la raíz del sitio (../). -->
<meta charset="utf-8">
<style>
@font-face{font-family:"Instrument Sans";src:url("../fonts/instrument-sans-var.woff2") format("woff2");font-weight:400 700;font-stretch:75% 100%}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:#161B1D;color:#fff;font-family:"Instrument Sans",system-ui,sans-serif}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:64% 46%}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,27,29,.55) 0,rgba(22,27,29,0) 28%,rgba(22,27,29,.2) 45%,rgba(22,27,29,.92) 100%),linear-gradient(90deg,rgba(22,27,29,.62),rgba(22,27,29,0) 70%)}
.logo{position:absolute;left:64px;top:48px;height:58px}
h1{position:absolute;left:64px;bottom:150px;width:880px;font-size:104px;line-height:.96;font-weight:700;font-stretch:84%;letter-spacing:-.024em}
.sub{position:absolute;left:64px;bottom:96px;font-size:30px;font-weight:500;color:rgba(255,255,255,.94)}
.wa{position:absolute;left:64px;bottom:34px;display:flex;align-items:center;gap:12px;height:48px;padding:0 24px;border-radius:99px;background:#0F7A40;font-size:24px;font-weight:650}
.wa svg{width:26px;height:26px}
.dash{position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#F5B700 0 40px,transparent 40px 72px)}
</style>
<img class="bg" src="../img/hero.webp"><div class="sh"></div>
<img class="logo" src="../img/logo-dark.svg" alt="">
